<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NSTR Fashions — Test Store</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f3eb;color:#24231f}
    header{background:#24231f;color:#fff;padding:18px 7%;display:flex;justify-content:space-between;align-items:center}
    header strong{font-size:22px;letter-spacing:2px}button{border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
    .hero{padding:60px 7%;background:#e8dfcf}.hero h1{font-size:46px;margin:0 0 10px}.hero p{font-size:18px}
    .wrap{padding:35px 7%}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
    .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 12px #0001}.pic{height:220px;border-radius:10px;background:linear-gradient(135deg,#d8c9b5,#8d806e);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:28px}
    .price{font-size:20px;font-weight:bold}.add{background:#24231f;color:white;width:100%}
    .panel{margin-top:30px;background:#fff;padding:25px;border-radius:14px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
    input{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ccc;border-radius:7px}.hidden{display:none}
    .success{background:#e6f4e8;padding:20px;border-radius:10px}
  </style>
  <script>
  (function (w, d, s, u) {
    if (w.oaiq) return;
    var q = function () {
      q.q.push(arguments);
    };
    q.q = [];
    w.oaiq = q;
    var js = d.createElement(s);
    js.async = true;
    js.src = u;
    var f = d.getElementsByTagName(s)[0];
    f.parentNode.insertBefore(js, f);
  })(window, document, "script", "https://bzrcdn.openai.com/sdk/oaiq.min.js");

  oaiq("init", {
    pixelId: "CYnxm9L3KA2Wn9gTGJW8FH",
    debug: true
  });
</script>
</head>
<body>
<header><strong>NSTR FASHIONS</strong><button onclick="showCart()">Cart (<span id="count">0</span>)</button></header>
<section class="hero"><h1>Discover Your Style</h1><p>Trendy fashion for every occasion.</p></section>
<main class="wrap">
  <h2>Featured Collection</h2>
  <div class="products" id="products"></div>

  <section id="cartPanel" class="panel hidden">
    <h2>Your Cart</h2><div id="cartItems"></div>
    <p><strong>Total: ₹<span id="total">0</span></strong></p>
    <button class="add" onclick="showCheckout()">Proceed to Checkout</button>
  </section>

  <section id="checkoutPanel" class="panel hidden">
    <h2>Checkout</h2>
    <label>Name</label><input id="name" placeholder="Test Customer">
    <label>Email</label><input id="email" placeholder="test@example.com">
    <label>Address</label><input id="address" placeholder="Test address">
    <button class="add" onclick="placeOrder()">Place Test Order</button>
  </section>

  <section id="successPanel" class="panel hidden">
    <div class="success"><h2>Order Successful 🎉</h2>
    <p>This is a test order. No real payment is processed.</p>
    <p>Order ID: <strong id="orderId"></strong></p></div>
  </section>
</main>

<script>
const products = [
 {id:"nstr-001",name:"Classic Casual Dress",price:1499},
 {id:"nstr-002",name:"Everyday Style Top",price:899},
 {id:"nstr-003",name:"Premium Denim Jeans",price:1799},
 {id:"nstr-004",name:"Elegant Party Dress",price:2199}
];
let cart=[];

function sendTestEvent(eventName, data={}){
  // PRACTICE PLACEHOLDER:
  // Replace this function with the official OpenAI Measurement Pixel/CAPI
  // implementation after creating your OpenAI data source.
  console.log("[NSTR TEST EVENT]", eventName, data);
  window.nstrTestEvents = window.nstrTestEvents || [];
  window.nstrTestEvents.push({eventName, data, timestamp:new Date().toISOString()});
}

function render(){
  document.getElementById("products").innerHTML=products.map(p=>`
    <div class="card">
      <div class="pic">${p.name.split(" ")[0]}</div>
      <h3>${p.name}</h3><p class="price">₹${p.price}</p>
      <button class="add" onclick="addToCart('${p.id}')">Add to Cart</button>
    </div>`).join("");
}
function addToCart(id){
  const p=products.find(x=>x.id===id); cart.push(p);
  document.getElementById("count").textContent=cart.length;
  sendTestEvent("items_added",{items:[{id:p.id,name:p.name,price:p.price}],quantity:1});
  showCart();
}
function showCart(){
  document.getElementById("cartPanel").classList.remove("hidden");
  document.getElementById("cartItems").innerHTML=cart.length?cart.map(p=>`<div class="row"><span>${p.name}</span><span>₹${p.price}</span></div>`).join(""):"<p>Your cart is empty.</p>";
  document.getElementById("total").textContent=cart.reduce((s,p)=>s+p.price,0);
}
function showCheckout(){
  if(!cart.length){alert("Add a product first.");return;}
  sendTestEvent("checkout_started",{items:cart.map(p=>({id:p.id,name:p.name,price:p.price})),value:cart.reduce((s,p)=>s+p.price,0),currency:"INR"});
  document.getElementById("checkoutPanel").classList.remove("hidden");
  document.getElementById("checkoutPanel").scrollIntoView({behavior:"smooth"});
}
function placeOrder(){
  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const address=document.getElementById("address").value.trim();

  if(!name||!email||!address){
    alert("Fill all fields for the test order.");
    return;
  }

  const value=cart.reduce((s,p)=>s+p.price,0);
  const orderId="NSTR-TEST-"+Date.now();

  // OpenAI conversion event
  oaiq(
    "measure",
    "order_created",
    {
      type: "contents",
      amount: value,
      currency: "INR",
      contents: cart.map(p => ({
        id: p.id,
        name: p.name,
        content_type: "product",
        quantity: 1,
        amount: p.price,
        currency: "INR"
      }))
    },
    {
      event_id: orderId
    }
  );

  document.getElementById("orderId").textContent=orderId;
  document.getElementById("successPanel").classList.remove("hidden");

  // rest of your existing code...
}
render();
sendTestEvent("page_viewed",{page:"home"});
</script>
</body>
</html>
